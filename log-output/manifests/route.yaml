apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: exercises
  name: log-output-route

spec:
  parentRefs:
    - name: log-output-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong

      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: ping-pong-knative.exercises.172.18.0.2.sslip.io                      
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /pingpong

      backendRefs:
        - name: ping-pong-knative       
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: log-output-svc
          port: 2345